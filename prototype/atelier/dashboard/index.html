        action: 'Flag for design' },
      { tag: 'Opportunity', bg: '#e1f4ff', fg: '#0040b0', item: 'Dresses',
        title: 'Customers are asking for sleeves',
        body: 'Associates relayed 94 requests for a long-sleeve version of the Sculpt Knit Midi. No current item matches.',
        action: 'Send to product team' },
    ];

    // ---- Signal stream (anonymized) ----
    const T = t => ({ isText: true, isRed: false, t });
    const R = r => ({ isText: false, isRed: true, r });
    const allFeed = [
      { role: 'Atelier operator', when: 'Today · 2–3 PM', region: 'Western Canada', item: 'Sculpt Knit Midi Dress', types: ['missed', 'sub', 'fit'],
        segs: [T('Hey Joule, do we have an alternative? We ran out of size 6s, but I think it runs small anyway.')] },
      { role: 'Boutique associate', when: 'Today · 1–2 PM', region: 'US West', item: 'Long Puffer', types: ['stock'],
        segs: [T('Hey Joule, is the Long Puffer in sand in a small at any nearby store? '), R('customer'), T(' needs it before '), R('personal detail'), T('.')] },
      { role: 'Atelier operator', when: 'Today · 12–1 PM', region: 'Ontario', item: 'Wide-Leg Trouser', types: ['tnb', 'fit'],
        segs: [T('That’s the third person today who tried on the wide-leg trouser and passed. They all said the rise feels too short.')] },
      { role: 'Atelier operator', when: 'Yesterday · 6–7 PM', region: 'Quebec', item: 'Contour Bodysuit', types: ['missed', 'fit'],
        segs: [T('Hey Joule, connect me to '), R('associate'), T('. We need the bodysuit in a 2, the 4 is too tight on her.')] },
      { role: 'Boutique associate', when: 'Yesterday · 4–5 PM', region: 'US East', item: 'Sculpt Knit Midi Dress', types: ['sub'],
        segs: [T('Hey Joule, do we have anything like the Sculpt Midi but with sleeves? Customers keep asking.')] },
      { role: 'Atelier operator', when: 'Yesterday · 3–4 PM', region: 'Western Canada', item: 'Ribbed Tank', types: ['missed', 'stock'],
        segs: [T('Hey Joule, any white ribbed tanks in a 4 in the back? '), R('customer'), T(' loved it but the floor only has 12s.')] },
      { role: 'Boutique associate', when: 'Oct 23 · 5–6 PM', region: 'US Central', item: 'Long Puffer', types: ['fit', 'tnb'],
        segs: [T('She sized down twice and it still felt big through the shoulders, so she left it.')] },
    ];
    const feed = allFeed.filter(q => sig === 'all' || q.types.includes(sig)).map(q => ({ ...q, tags: q.types.map(k => typeBy[k]) }));

    // ---- Regions & pipeline ----
    const reg = [['Western Canada', 4820], ['Ontario', 4110], ['US West', 3240], ['US East', 3060], ['Quebec', 1690], ['US Central', 1492]];
    const rmax = Math.max(...reg.map(r => r[1]));
    const regions = reg.map(([n, v]) => ({ name: n, v: fmt(v), w: Math.round(v / rmax * 100), aria: n + ': ' + fmt(v) + ' signals' }));
    const steps = [
      { n: 1, title: 'Heard on the earpiece', body: 'An associate says “Hey Joule…”. Only requests to Joule are processed, never background talk.' },
      { n: 2, title: 'Transcribed and scrubbed on the device', body: 'Names, voices, employee IDs and customer details are replaced with tags. The audio is discarded.' },
      { n: 3, title: 'Tagged by Joule', body: 'Each snippet is tagged with the item, size and signal type, such as missed size or fit comment.' },
      { n: 4, title: 'Grouped before sync', body: 'Boutique becomes region, time becomes the hour. Items need 5+ signals before they appear.' },
      { n: 5, title: 'Synced to Business Data Cloud', body: 'Signals join S/4HANA sales and stock data and refresh this story every 15 minutes.' },
    ].map((s, i, a) => ({ ...s, line: i < a.length - 1 }));

    // ---- Pages ----
    const pages = [['overview', 'Overview'], ['atelier', 'Atelier Demand Signal'], ['inventory', 'Inventory Health'], ['handoffs', 'Store Hand-offs']];
    const tabs = pages.map(([k, l]) => ({
      label: l, sel: page === k, pick: () => this.setState({ page: k }),
      style: 'height: 40px; padding: 0 14px; border: 0; background: transparent; cursor: pointer; font-size: 14px; ' +
        (page === k ? 'color: #0064d9; font-weight: 700; box-shadow: inset 0 -3px 0 #0064d9' : 'color: #32475c; font-weight: 400; box-shadow: none'),
    }));

    return {
      defs: types, tabs, sigs, sigLabel, weeks, gridlines, trendAria, kpis, insights,
      sizes, heat, heatMax, fit, rows, feed, feedCount: feed.length + (feed.length === 1 ? ' snippet' : ' snippets'), feedEmpty: feed.length === 0,
      regions, steps,
      isAtelier: page === 'atelier', isOther: page !== 'atelier',
      otherTitle: (pages.find(p => p[0] === page) || pages[1])[1],
      goAtelier: () => this.setState({ page: 'atelier' }),
    };
  }
}

tplRoot = document.getElementById('tpl').content;
comp = new Component({});
render();
</script>
