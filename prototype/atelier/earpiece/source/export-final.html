<html><body style="margin:0;background:#fff">
<script src="node_modules/three/build/three.min.js"></script>
<script src="node_modules/three/examples/js/exporters/GLTFExporter.js"></script>
<script src="node_modules/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="node_modules/three/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="builder.js"></script>
<script>
// ---------- Gradient textures for the lights ----------
function hex(c) { return '#' + c.toString(16).padStart(6, '0'); }
function rgba(c, a) { return `rgba(${(c >> 16) & 255},${(c >> 8) & 255},${c & 255},${a})`; }
function texture(kind, col, core) {
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  if (kind === 'lens') {
    // Sphere UV: v=1 at the front pole (top row) -> hot near-white core, out to saturated rim
    cv.width = 8; cv.height = 256;
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0.00, hex(core)); gr.addColorStop(0.05, hex(core));
    gr.addColorStop(0.2, hex(col)); gr.addColorStop(0.5, hex(col)); gr.addColorStop(1, rgba(col, 1));
    g.fillStyle = gr; g.fillRect(0, 0, 8, 256);
  } else {
    cv.width = cv.height = 256;
    if (kind === 'haloEmissive') { g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256); }
    const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    const stops = [[0, 1], [0.2, 0.95], [0.34, 0.7], [0.5, 0.4], [0.7, 0.16], [0.86, 0.05], [1, 0]];
    for (const [o, a] of stops) gr.addColorStop(o, kind === 'haloEmissive'
      ? `rgb(${Math.round(((col >> 16) & 255) * a)},${Math.round(((col >> 8) & 255) * a)},${Math.round((col & 255) * a)})`
      : rgba(col, a));
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  }
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; return t;
}

// ---------- Build skinned model (PowerPoint only plays skeletal animation) ----------
function buildSkinned() {
  const MM = 0.001;
  const built = buildEarpiece(THREE, { cable: false, texture });
  const src = built.group;
  built.parts.LED_Green.scale.setScalar(1); built.parts.LED_Blue.scale.setScalar(1);
  src.updateMatrixWorld(true);
  const ctr = new THREE.Box3().setFromObject(src).getCenter(new THREE.Vector3());
  const toLocal = v => v.clone().sub(ctr).multiplyScalar(MM);
  const movers = { MuteButton: 'Bone_Mute', PowerButton: 'Bone_Power', LED_Green: 'Bone_LEDGreen', LED_Blue: 'Bone_LEDBlue' };
  const spin = new THREE.Bone(); spin.name = 'Bone_Root';
  const bones = [spin], idx = { Bone_Root: 0 };
  for (const [node, bn] of Object.entries(movers)) {
    const b = new THREE.Bone(); b.name = bn;
    b.position.copy(toLocal(src.getObjectByName(node).getWorldPosition(new THREE.Vector3())));
    spin.add(b); idx[bn] = bones.length; bones.push(b);
  }
  const root = new THREE.Group(); root.name = 'AtelierEarpiece';
  const rig = new THREE.Group(); rig.name = 'Rig'; rig.add(spin); root.add(rig);
  root.updateMatrixWorld(true);
  const skeleton = new THREE.Skeleton(bones);
  const boneFor = o => { for (let p = o; p; p = p.parent) if (movers[p.name]) return idx[movers[p.name]]; return 0; };
  const byMat = new Map();
  src.traverse(o => {
    if (!o.isMesh) return;
    let g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    g.translate(-ctr.x, -ctr.y, -ctr.z); g.scale(MM, MM, MM);
    if (g.index) g = g.toNonIndexed();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    const n = g.attributes.position.count;
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(n * 2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    g.morphAttributes = {}; g.clearGroups();
    const bi = boneFor(o), si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) { si[i * 4] = bi; sw[i * 4] = 1; }
    g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
    if (!byMat.has(o.material)) byMat.set(o.material, { geos: [], order: o.renderOrder });
    byMat.get(o.material).geos.push(g);
  });
  for (const [mat, { geos, order }] of byMat) {
    const m = new THREE.SkinnedMesh(THREE.BufferGeometryUtils.mergeBufferGeometries(geos), mat);
    m.name = mat.name; m.renderOrder = order; rig.add(m); m.bind(skeleton);
  }
  bones[idx.Bone_LEDGreen].scale.setScalar(0.001); bones[idx.Bone_LEDBlue].scale.setScalar(0.001);
  root.updateMatrixWorld(true);
  const rename = { ...movers };
  const clips = buildClips(THREE, built.parts).map(c => new THREE.AnimationClip(c.name, c.duration, c.tracks.map(t => {
    const [node, prop] = t.name.split('.'); const tt = t.clone(); tt.name = rename[node] + '.' + prop;
    if (prop === 'position') { const v = tt.values; for (let i = 0; i < v.length; i += 3) { const p = toLocal(new THREE.Vector3(v[i], v[i + 1], v[i + 2])); v[i] = p.x; v[i + 1] = p.y; v[i + 2] = p.z; } }
    return tt;
  })));
  return { root, clips };
}

window.exportGLB = () => new Promise((res, rej) => {
  const { root, clips } = buildSkinned();
  new THREE.GLTFExporter().parse(root, buf => {
    const bytes = new Uint8Array(buf); let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    window.lastGLB = buf; res(btoa(s));
  }, rej, { binary: true, animations: clips });
});

// ---------- Render check frames from the exported GLB ----------
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(1200, 500);
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
window.loadAndShoot = async (shots) => {
  const g = await new Promise((ok, no) => new THREE.GLTFLoader().parse(window.lastGLB, '', ok, no));
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9ebee);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 0.9));
  const dl = new THREE.DirectionalLight(0xffffff, 1.3); dl.position.set(1, 2, 3); scene.add(dl);
  scene.add(g.scene); const mixer = new THREE.AnimationMixer(g.scene);
  const cam = new THREE.PerspectiveCamera(30, 1200 / 500, 0.001, 10);
  const out = [];
  for (const [clip, t, view] of shots) {
    mixer.stopAllAction();
    if (clip) { const a = mixer.clipAction(THREE.AnimationClip.findByName(g.animations, clip)); a.play(); mixer.setTime(t); }
    scene.updateMatrixWorld(true);
    const p = g.scene.getObjectByName('Bone_Mute').getWorldPosition(new THREE.Vector3());
    if (view === 'close') { cam.position.set(p.x + 0.012, p.y + 0.01, p.z + 0.05); cam.lookAt(p.x + 0.005, p.y + 0.001, p.z); }
    else { cam.position.set(0.09, 0.05, 0.3); cam.lookAt(0, 0, 0); }
    r.render(scene, cam); out.push(r.domElement.toDataURL('image/png'));
  }
  return { names: g.animations.map(a => a.name + ' ' + a.duration + 's'), out };
};
window.ready = true;
</script></body></html>
